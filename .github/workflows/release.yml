name: Release

on:
  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

# No cancel-in-progress: the next push must not cancel a run that is tagging
# a release or submitting it to opam-repository.
concurrency:
  group: ${{ github.workflow }}

jobs:
  changesets:
    name: Version or tag
    if: ${{ github.repository_owner == 'smorimoto' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # to push the version branch, the tag, and the release
      pull-requests: write # to open the version pull request
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set-up tools with mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false

      - name: Install npm dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Open the version pull request or tag the release
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          version-script: sh -c "bun changeset version && jq --raw-output .version package.json >VERSION"
          publish-script: bun changeset publish

  opam:
    name: Submit to opam-repository
    needs: changesets
    if: ${{ needs.changesets.outputs.published == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set-up OCaml 5
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: 5

      - name: Install opam-publish
        run: opam install opam-publish

      - name: Open the opam-repository pull request
        env:
          OPAM_PUBLISH_GH_TOKEN: ${{ secrets.OPAM_PUBLISH_GH_TOKEN }}
        run: opam exec -- opam-publish --no-browser --no-confirmation --tag "v$(cat VERSION)" .
