name: Opam dependency submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Submit the opam dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # submit the dependency snapshot to the Dependency Graph
    steps:
      - name: Checkout tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set-up OCaml 5
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: 5

      - name: Submit the dependency snapshot
        uses: ocaml/setup-ocaml/analysis@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
