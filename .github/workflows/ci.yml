name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set-up OCaml 5
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: 5

      - name: Set-up tools with mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5

      - name: Install opam dependencies
        run: opam install . --deps-only --with-test

      - name: Install npm dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build the plugin and theories
        run: opam exec -- dune build

      - name: Run the tests
        run: opam exec -- dune test

  lint:
    name: Lint and check formatting
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set-up tools with mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5

      - name: Install npm dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint the shell scripts
        run: |
          shellcheck test/*.sh
          shfmt -d test/*.sh

      - name: Lint the workflows
        run: jactionlint

      - name: Lint and check the formatting of the TypeScript
        run: bun run lint
